name: Daily signals

on:
  schedule:
    - cron: "5 1 * * *"    # 09:05 Philippine time: after the daily close, before you trade
    - cron: "35 2 * * *"   # 10:35: retry if the morning prices were late (sends nothing if already done)
    - cron: "20 12 * * *"  # 20:20: reads your replies
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run the bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 bot.py

      - name: Save the journal and calendar
        run: |
          git config user.name "signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs
          if ! git diff --cached --quiet; then
            git commit -m "Signal bot: update journal"
            git push
          fi
